version: "2"

run:
  {tests: true, timeout: 5m, allow-parallel-runners: true}

linters:
  default: none
  enable:
    # === Core error detection ===
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asasalint

    # === Context, HTTP, errors, nil ===
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - nilnil
    - nilerr
    - noctx
    - errname
    - canonicalheader

    # === Security & Dependencies ===
    - gosec
    - depguard
    - asciicheck
    - bidichk

    # === Performance & modern Go ===
    - gocritic
    - dupl
    - perfsprint
    - modernize
    - usestdlibvars
    - usetesting
    - copyloopvar
    - intrange
    - durationcheck
    - makezero
    - exptostd

    # === Code quality & style ===
    - revive
    - unconvert
    - unparam
    - goconst
    - misspell
    - nakedret
    - predeclared
    - whitespace
    - gocyclo
    - wastedassign
    - nolintlint
    - musttag
    - dupword
    - recvcheck
    - interfacebloat
    - tagalign

    # === SQL ===
    - rowserrcheck
    - sqlclosecheck

    # === Test & Logging (Prod essentials) ===
    - loggercheck
    - sloglint
    - testifylint
    - testableexamples
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam

    govet:
      enable: [shadow, nilness]
      disable: [fieldalignment]

    errcheck:
      check-type-assertions: false
      check-blank: true

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocyclo: {min-complexity: 20}
    goconst: {min-len: 5, min-occurrences: 4, ignore-tests: true}

    misspell: {locale: US}
    nakedret: {max-func-lines: 30}

    nolintlint: {allow-unused: false, require-explanation: true, require-specific: true}

    dupl: {threshold: 120}

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true

    depguard:
      rules:
        main:
          deny:
            # 1. Standardization
            - pkg: "github.com/pkg/errors"
              desc: "Use standard library 'errors' and 'fmt.Errorf' with %w"
            - pkg: "io/ioutil"
              desc: "Deprecated in Go 1.16. Use 'io' or 'os' instead"
            # 2. Modern Go Features
            - pkg: "math/rand$"
              desc: "Use 'math/rand/v2' for better performance and security"
            - pkg: "log$"
              desc: "Prefer structured logging with 'log/slog'"
            # 3. Critical for Large Prod Projects (Security & Maintenance)
            - pkg: "github.com/satori/go.uuid"
              desc: "Unmaintained. Use 'github.com/google/uuid' instead"
            - pkg: "github.com/dgrijalva/jwt-go"
              desc: "Has known CVEs. Use 'github.com/golang-jwt/jwt/v5'"
            - pkg: "github.com/golang/protobuf"
              desc: "Use the new 'google.golang.org/protobuf' API"

    loggercheck: {slog: true, kitlog: false, klog: false, logr: false, zap: false}

    tagalign:
      align: false
      sort: true
      order: [nflow, default, json, yaml, toml, xml, validate]

  exclusions:
    generated: strict
    warn-unused: true
    presets: [comments, common-false-positives, legacy, std-error-handling]
    rules:
      - path: _test\.go
        linters: [dupl, nilnil, goconst, gocyclo, errcheck, unparam]

      - path: _test\.go
        text: '^shadow: declaration of "err"'
        linters: [govet]

formatters:
  enable: [gofumpt, gci]
  settings:
    gofumpt:
      rewrite-rules:
          - pattern: 'interface{}'
            replacement: 'any'
      extra:
        group-params: true
    gci:
      sections: [standard, default, localmodule]
